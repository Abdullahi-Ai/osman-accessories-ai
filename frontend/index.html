<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osman AI - Khalid & Osman Accessories</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .message-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .message-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        .message-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(71, 85, 105, 0.8);
            border-radius: 20px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(20,184,166,0.3),rgba(255,255,255,0))]">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { role: 'assistant', content: 'Hello! I am Osman AI, your shopping assistant for Khalid & Osman Accessories. How can I help you find the perfect device or accessory today?' }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
                setTimeout(() => lucide.createIcons(), 50); // Re-init icons when rendered
            }, [messages]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const userMsg = input;
                setInput('');
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setIsLoading(true);

                try {
                    // Expecting FastAPI to be running on port 8000
                    const response = await fetch('http://localhost:8000/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMsg })
                    });
                    
                    const data = await response.json();
                    
                    setMessages(prev => [...prev, { 
                        role: 'assistant', 
                        content: data.reply || "Sorry, I couldn't process that request." 
                    }]);
                } catch (error) {
                    console.error("Error connecting to backend:", error);
                    setMessages(prev => [...prev, { 
                        role: 'assistant', 
                        content: "I'm having trouble connecting to my knowledge base right now. Please ensure the backend is running on port 8000." 
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-full max-w-4xl mx-auto p-4 md:p-8 animate-fade-in">
                    
                    {/* Header */}
                    <header className="flex items-center gap-4 mb-6">
                        <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-lg shadow-brand-500/30">
                            <i data-lucide="bot" className="text-white w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 className="font-display font-bold text-2xl tracking-tight text-white">Osman AI</h1>
                            <p className="text-brand-400 text-sm font-medium">Khalid & Osman Accessories</p>
                        </div>
                    </header>

                    {/* Chat Container */}
                    <div className="flex-1 glass-panel rounded-3xl overflow-hidden flex flex-col shadow-2xl relative z-10">
                        
                        {/* Messages Area */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-6 message-scrollbar">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up`} style={{animationDelay: `${idx * 0.05}s`}}>
                                    <div className={`max-w-[85%] md:max-w-[75%] rounded-2xl p-4 shadow-md ${
                                        msg.role === 'user' 
                                            ? 'bg-brand-600 text-white rounded-tr-sm' 
                                            : 'bg-slate-800/80 text-slate-200 border border-slate-700 rounded-tl-sm'
                                    }`}>
                                        <p className="text-sm leading-relaxed whitespace-pre-wrap font-sans">{msg.content}</p>
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex justify-start animate-fade-in">
                                    <div className="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-sm p-4 flex gap-2 shadow-md">
                                        <div className="w-2 h-2 rounded-full bg-brand-500 animate-bounce"></div>
                                        <div className="w-2 h-2 rounded-full bg-brand-500 animate-bounce" style={{animationDelay: '0.15s'}}></div>
                                        <div className="w-2 h-2 rounded-full bg-brand-500 animate-bounce" style={{animationDelay: '0.3s'}}></div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="p-4 bg-slate-900/80 border-t border-slate-800">
                            <form onSubmit={sendMessage} className="relative flex items-center">
                                <input 
                                    type="text" 
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    placeholder="Ask about a smartphone, tablet, or accessory..." 
                                    className="w-full bg-slate-800/50 text-slate-100 placeholder-slate-400 border border-slate-700 rounded-full py-4 pl-6 pr-14 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
                                />
                                <button 
                                    type="submit"
                                    disabled={!input.trim() || isLoading}
                                    className="absolute right-2 p-3 rounded-full bg-brand-600 text-white hover:bg-brand-500 disabled:opacity-50 disabled:hover:bg-brand-600 transition-colors shadow-lg flex items-center justify-center"
                                >
                                    <i data-lucide="send" className="w-4 h-4"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initial icon load
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
